<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />  </head>
  <body>
    <div id="image-container">

      <div id="container">
        <button id="next">next</button>
        <button id="previous">previous</button>
        <button id="slideshow">slideshow</button>
        <button id="stop_slideshow">stop slideshow</button>
      </div>
      <div id="image-container">
        <img id="divImg" src="" alt="Image 1" style="width: 30%; height: 30%" />
      </div>
      
    </div>
    <div
      id="form-container"style="background-color: rgb(205, 205, 207);width: fit-content;padding: 10px;margin: 10px 0 0 10px;">
      <div style="display: inline">
        <span>Department</span>
        <input type="radio" name="dep" id="sd" value="sd" checked/>
        <label for="sd">SD</label>
        <input type="radio" id="os" name="dep" value="os" />
        <label for="os">OS</label>
        <input type="radio" id="el" name="dep" value="el" />
        <label for="el">EL</label>
      </div>
      <form id="myform" >
        <span>Student Name</span>
        <input type="text" id="name" placeholder="name" class="form-text"/>
        <span style="display: none;"></span>
        <br>
        <span>Student Grade</span>
        <input type="text" id="grade" class="form-text" placeholder="grade" />
        <span style="display: none;"></span>
        <br>
      </form>
      <button  id="addBtn" style="width: 40px" type="submit">add</button>

      <div id="filtering-container" style="display: grid; grid-template-columns: 1fr 1fr">
      
        <span>Sort</span>
        <select name="" id="">
          <option value="">name</option>
          <option value="">grade</option>
        </select>
      
        <span>Filter</span>
        <select name="" id="">
            
            <option value="all">all</option>
            <option value="success">success</option>
            <option value="failed">failed</option>

        </select>
      </div>


        <div id="table-container" >
            <table id="myTable" style="width: 500px ;border: 1px solid black;">
            <thead>
                <tr>
                <th>Student Name</th>
                <th>Student Grade</th>
                <th>Department</th>
                <th></th>
                </tr>
            </thead>
            <tbody id="tbody" style="border: 1px solid black;">
            
            </tbody>
            </table>

    </div>

    <script src="javaScript.js"></script>
  </body>
</html>
